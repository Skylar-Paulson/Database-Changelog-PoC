name: Generate Database Changelog Release

on:
  push:
    branches:
      - qa
      - prod
    # NOTE: No path filter here - workflow always runs on merge to qa/prod
    # This ensures we catch changes even if a previous workflow failed
    # The workflow will check for SQL files added since LAST RELEASE, not just this push
    # If no changes found, it exits gracefully without creating a release

permissions:
  contents: write
  pull-requests: write  # For adding comments on PRs with release links

jobs:
  generate-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for accurate git log

      - name: Detect environment from branch
        id: env
        env:
          REF_NAME: ${{ github.ref }}
        run: |
          BRANCH_NAME="${REF_NAME#refs/heads/}"
          echo "branch=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "env=$(echo $BRANCH_NAME | tr '[:lower:]' '[:upper:]')" >> $GITHUB_OUTPUT
          echo "env_lower=$BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: Find last release tag
        id: last_tag
        env:
          ENV_LOWER: ${{ steps.env.outputs.env_lower }}
        run: |
          # Find the last release tag for THIS ENVIRONMENT ONLY
          # Each environment (dev/qa/prod) maintains independent release history
          # Example: If ENV_LOWER="qa", only searches for "qa-*" tags (ignores "prod-*", "dev-*")
          # This ensures QA releases start from last QA release, not from PROD releases
          LAST_TAG=$(git tag -l "${ENV_LOWER}-*" --sort=-version:refname | head -1)

          if [ -z "$LAST_TAG" ]; then
            # No previous release, use first commit
            FIRST_COMMIT=$(git rev-list --max-parents=0 HEAD)
            echo "tag=" >> $GITHUB_OUTPUT
            echo "since=$FIRST_COMMIT" >> $GITHUB_OUTPUT
            echo "display=repository start" >> $GITHUB_OUTPUT
            echo "No previous release found, using repository start"
          else
            echo "tag=$LAST_TAG" >> $GITHUB_OUTPUT
            echo "since=$LAST_TAG" >> $GITHUB_OUTPUT
            echo "display=$LAST_TAG" >> $GITHUB_OUTPUT
            echo "Found previous release: $LAST_TAG"
          fi

      - name: Get changed SQL files
        id: sql_files
        env:
          SINCE: ${{ steps.last_tag.outputs.since }}
        run: |
          # Get all SQL files added since the LAST SUCCESSFUL RELEASE
          # This checks against the last release tag, NOT just changes in this push
          # If a previous workflow failed, this will catch those missed files
          mapfile -t SQL_FILES < <(git diff --name-only --diff-filter=A "$SINCE"...HEAD -- "*.sql" | \
            grep -v "^\.github/" | \
            grep -v "^docs/" || true)

          if [ ${#SQL_FILES[@]} -eq 0 ]; then
            echo "No SQL files added since last release ($SINCE)"
            echo "This workflow runs on every merge to catch failures, but no new SQL files were found."
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "has_changes=true" >> $GITHUB_OUTPUT
          echo "Found ${#SQL_FILES[@]} changed SQL files"

          # Save files to a temporary file for next step
          printf '%s\n' "${SQL_FILES[@]}" > /tmp/sql_files.txt

      - name: Order files by commit timestamp
        if: steps.sql_files.outputs.has_changes == 'true'
        id: ordered_files
        run: |
          # Read SQL files and get their commit timestamps
          declare -A file_timestamps
          declare -A file_commits

          while IFS= read -r file; do
            # Get the timestamp when file was first added
            timestamp=$(git log --diff-filter=A --format=%at --all -- "$file" | head -1)
            commit_hash=$(git log --diff-filter=A --format=%h --all -- "$file" | head -1)
            file_timestamps["$file"]="$timestamp"
            file_commits["$file"]="$commit_hash"
          done < /tmp/sql_files.txt

          # Sort files by timestamp
          for file in "${!file_timestamps[@]}"; do
            echo "${file_timestamps[$file]} $file ${file_commits[$file]}"
          done | sort -n > /tmp/sorted_files.txt

          echo "Files sorted by commit timestamp"

      - name: Generate release tag and timestamp
        id: release_info
        env:
          ENV_LOWER: ${{ steps.env.outputs.env_lower }}
          ENV_UPPER: ${{ steps.env.outputs.env }}
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          TAG_DATE=$(date -u +"%Y.%m.%d.%H%M")

          RELEASE_TAG="${ENV_LOWER}-${TAG_DATE}"
          RELEASE_NAME="${ENV_UPPER} - ${TAG_DATE}"

          echo "tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
          echo "name=$RELEASE_NAME" >> $GITHUB_OUTPUT
          echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT
          echo "Release tag: $RELEASE_TAG"

      - name: Generate compiled SQL file
        if: steps.sql_files.outputs.has_changes == 'true'
        env:
          ENV_UPPER: ${{ steps.env.outputs.env }}
          TIMESTAMP: ${{ steps.release_info.outputs.timestamp }}
          RELEASE_TAG: ${{ steps.release_info.outputs.tag }}
          SINCE_DISPLAY: ${{ steps.last_tag.outputs.display }}
        run: |
          OUTPUT_FILE="database-changelog-${RELEASE_TAG}.sql"

          # Count total files
          TOTAL_FILES=$(wc -l < /tmp/sorted_files.txt)

          # Write header
          cat > "$OUTPUT_FILE" << EOF
          -- ============================================
          -- DATABASE CHANGELOG RELEASE
          -- Environment: $ENV_UPPER
          -- Generated: $TIMESTAMP
          -- Release Tag: $RELEASE_TAG
          -- Changes Since: $SINCE_DISPLAY
          -- ============================================

          EOF

          # Process files grouped by commit to avoid duplicate commit messages
          # When multiple files are changed in the same commit, show the commit message once

          PREV_COMMIT=""
          COMMIT_FILE_NUM=0
          COMMIT_NUM=1

          # First pass: count files per commit
          declare -A commit_file_counts
          while IFS=' ' read -r timestamp file commit_hash; do
            commit_file_counts[$commit_hash]=$((${commit_file_counts[$commit_hash]:-0} + 1))
          done < /tmp/sorted_files.txt

          # Second pass: generate SQL with commit grouping
          while IFS=' ' read -r timestamp file commit_hash; do
            # Check if this is a new commit
            if [ "$commit_hash" != "$PREV_COMMIT" ]; then
              # New commit - output commit header once
              COMMIT_FILE_NUM=1
              TOTAL_COMMIT_FILES=${commit_file_counts[$commit_hash]}

              commit_date=$(git log -1 --format=%ci "$commit_hash")
              commit_message=$(git log -1 --format=%B "$commit_hash" | head -c 5000 | sed '2,$s/^/--          /' | sed '/^[[:space:]]*$/d')

              cat >> "$OUTPUT_FILE" << EOF
          -- ============================================
          -- Commit $COMMIT_NUM: $commit_hash
          -- Date: $commit_date
          -- Files in this commit: $TOTAL_COMMIT_FILES
          -- Message: $commit_message
          -- ============================================

          EOF
              ((COMMIT_NUM++))
              PREV_COMMIT="$commit_hash"
            fi

            # Output simplified file header
            schema_folder=$(dirname "$file")
            filename=$(basename "$file")

            cat >> "$OUTPUT_FILE" << EOF
          -- --------------------------------------------
          -- File $COMMIT_FILE_NUM of $TOTAL_COMMIT_FILES: $schema_folder/$filename
          -- --------------------------------------------
          EOF

            # Append file contents
            cat "$file" >> "$OUTPUT_FILE"

            # Ensure statement ends with semicolon
            if ! tail -1 "$OUTPUT_FILE" | grep -q ';[[:space:]]*$'; then
              echo ";" >> "$OUTPUT_FILE"
            fi

            # Add blank lines between files
            echo "" >> "$OUTPUT_FILE"
            echo "" >> "$OUTPUT_FILE"

            ((COMMIT_FILE_NUM++))
          done < /tmp/sorted_files.txt

          echo "Generated compiled SQL file: $OUTPUT_FILE"
          echo "output_file=$OUTPUT_FILE" >> $GITHUB_ENV

      - name: Create ZIP archive
        if: steps.sql_files.outputs.has_changes == 'true'
        env:
          RELEASE_TAG: ${{ steps.release_info.outputs.tag }}
        run: |
          ZIP_FILE="database-changelog-${RELEASE_TAG}.zip"

          # Create ZIP with all changed SQL files, preserving folder structure
          zip -r "$ZIP_FILE" $(cat /tmp/sql_files.txt | tr '\n' ' ')

          echo "Created ZIP archive: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> $GITHUB_ENV

      - name: Generate release notes
        if: steps.sql_files.outputs.has_changes == 'true'
        id: release_notes
        env:
          LAST_TAG: ${{ steps.last_tag.outputs.tag }}
          SINCE_DISPLAY: ${{ steps.last_tag.outputs.display }}
          ENV_UPPER: ${{ steps.env.outputs.env }}
          RELEASE_TAG: ${{ steps.release_info.outputs.tag }}
          TIMESTAMP: ${{ steps.release_info.outputs.timestamp }}
        run: |
          # Generate custom release notes with commit list

          # Count SQL files
          TOTAL_FILES=$(wc -l < /tmp/sorted_files.txt)

          # Get commit list since last release
          if [ -n "$LAST_TAG" ]; then
            # Get commits between last tag and HEAD, format as markdown list
            COMMITS=$(git log --pretty=format:"* %s (%h) - %an" "${LAST_TAG}..HEAD" | head -20)
            COMPARE_LINK="**Full Changelog**: https://github.com/${{ github.repository }}/compare/${LAST_TAG}...${RELEASE_TAG}"
          else
            # First release, show recent commits
            COMMITS=$(git log --pretty=format:"* %s (%h) - %an" HEAD | head -20)
            COMPARE_LINK="**Full Changelog**: https://github.com/${{ github.repository }}/commits/${RELEASE_TAG}"
          fi

          # Build release notes
          cat > /tmp/release_notes.md << 'EOF'
          ## Database Changelog Release

          **Environment:** $ENV_UPPER
          **Generated:** $TIMESTAMP
          **Changes Since:** $SINCE_DISPLAY
          **Total SQL Files:** $TOTAL_FILES

          ### Release Assets

          1. **Compiled SQL File** (`database-changelog-$RELEASE_TAG.sql`)
             - Main deployment file - copy-paste ready for execution
             - Contains all database changes in chronological order with metadata

          2. **ZIP Archive** (`database-changelog-$RELEASE_TAG.zip`)
             - Individual SQL files in original folder structure
             - For reference, audit trail, or debugging

          3. **Release Notes** (this file)
             - Context and commit history for this release

          ### How to Deploy

          1. Download the compiled SQL file from this release
          2. Review all SQL statements carefully
          3. Execute in the $ENV_UPPER database(s)
          4. Verify changes were applied successfully

          ### Commits Included

          EOF

          # Append commits
          echo "$COMMITS" >> /tmp/release_notes.md
          echo "" >> /tmp/release_notes.md
          echo "$COMPARE_LINK" >> /tmp/release_notes.md

          # Substitute environment variables in the markdown
          envsubst < /tmp/release_notes.md > /tmp/release_notes_final.md

          # Output for next step (escape newlines for GitHub Actions)
          {
            echo 'body<<RELEASE_NOTES_EOF'
            cat /tmp/release_notes_final.md
            echo 'RELEASE_NOTES_EOF'
          } >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: steps.sql_files.outputs.has_changes == 'true'
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.name }}
          target_commitish: ${{ steps.env.outputs.env_lower }}
          body: ${{ steps.release_notes.outputs.body }}
          files: |
            ${{ env.output_file }}
            ${{ env.zip_file }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on PR with release link
        if: steps.sql_files.outputs.has_changes == 'true'
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          RELEASE_TAG: ${{ steps.release_info.outputs.tag }}
          RELEASE_NAME: ${{ steps.release_info.outputs.name }}
          ENV_UPPER: ${{ steps.env.outputs.env }}
        uses: actions/github-script@v7
        with:
          script: |
            // Check if this commit is from a PR merge or squash
            // Matches both "Merge pull request #123" and "Title (#123)"
            const commitMessage = process.env.COMMIT_MESSAGE || '';
            const prMatch = commitMessage.match(/#(\d+)/);

            if (!prMatch) {
              console.log('Not a PR commit (no #number found), skipping comment');
              return;
            }

            const prNumber = parseInt(prMatch[1]);
            const releaseTag = process.env.RELEASE_TAG;
            const releaseName = process.env.RELEASE_NAME;
            const environment = process.env.ENV_UPPER;
            const releaseUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/releases/tag/${releaseTag}`;

            console.log(`Found PR #${prNumber}, adding comment with release link`);

            // Create comment with release information
            const comment = "## Database Changelog Release Created\n\n" +
              "Release: [" + releaseName + "](" + releaseUrl + ")\n\n" +
              "Environment: " + environment + "\n\n" +
              "Tag: " + releaseTag + "\n\n" +
              "### Release Assets\n\n" +
              "The following files are ready for deployment:\n\n" +
              "1. Compiled SQL File - Main deployment file (copy-paste into " + environment + " database)\n" +
              "2. ZIP Archive - Individual SQL files for reference\n" +
              "3. Release Notes - Auto-generated from commit messages\n\n" +
              "### Next Steps\n\n" +
              "1. [Download the compiled SQL file](" + releaseUrl + ") from the release\n" +
              "2. Review the SQL statements\n" +
              "3. Execute in the " + environment + " database\n" +
              "4. Verify changes in " + environment + "\n\n" +
              "---\n" +
              "This release was automatically generated by the database changelog system.";

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: comment
            });

            console.log(`Comment added to PR #${prNumber}`);

      - name: No changes detected
        if: steps.sql_files.outputs.has_changes != 'true'
        run: |
          echo "::notice::No SQL files added since last release. No release needed."
          echo "::notice::This workflow runs on every push to qa/prod to catch any missed changes from previous failures."
          echo "::notice::No new SQL files were found, so no release will be created."
